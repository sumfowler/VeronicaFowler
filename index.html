<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veronica J. Fowler | Musical Theatre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@100;300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c9a84c;--gold-light:#e8d49e;--gold-dim:#7a6130;--ink:#0e0c0a;--cream:#f5f0e8;--muted:#7a7469;--card-bg:#1a1714;--card-border:rgba(201,168,76,0.18)}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--cream);font-family:'Josefin Sans',sans-serif;font-weight:300;letter-spacing:0.04em;overflow-x:hidden}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.5rem 3rem;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(14,12,10,0.9),transparent);pointer-events:none}
.nav-name{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-style:italic;color:var(--cream);opacity:0;animation:fadeUp 0.8s 1.3s ease forwards;pointer-events:all;text-decoration:none}
.nav-links{display:flex;gap:2rem;list-style:none;pointer-events:all}
.nav-links a{font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color 0.3s;opacity:0;animation:fadeUp 0.8s 1.4s ease forwards}
.nav-links a:hover{color:var(--gold)}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding:4rem 2rem;background:radial-gradient(ellipse 80% 60% at 50% 40%,#2a1f10 0%,var(--ink) 70%)}
.hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 80px,rgba(201,168,76,0.03) 80px,rgba(201,168,76,0.03) 81px),repeating-linear-gradient(90deg,transparent,transparent 80px,rgba(201,168,76,0.03) 80px,rgba(201,168,76,0.03) 81px);pointer-events:none}
.hero-eyebrow{font-size:0.7rem;letter-spacing:0.35em;color:var(--gold);text-transform:uppercase;margin-bottom:2rem;opacity:0;animation:fadeUp 0.8s 0.2s ease forwards}
.hero-name{font-family:'Cormorant Garamond',serif;font-size:clamp(3.5rem,10vw,8rem);font-weight:300;line-height:1;letter-spacing:0.02em;color:var(--cream);opacity:0;animation:fadeUp 0.9s 0.4s ease forwards}
.hero-name em{font-style:italic;color:var(--gold)}
.hero-tagline{margin-top:1.5rem;font-size:0.75rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);opacity:0;animation:fadeUp 0.9s 0.65s ease forwards}
.hero-divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:2.5rem auto;opacity:0;animation:fadeUp 0.9s 0.85s ease forwards}
.hero-scroll{font-size:0.65rem;letter-spacing:0.3em;color:var(--muted);text-transform:uppercase;opacity:0;animation:fadeUp 0.9s 1.1s ease forwards;cursor:pointer;transition:color 0.3s;background:none;border:none}
.hero-scroll:hover{color:var(--gold)}
.section-header{text-align:center;padding:6rem 2rem 3rem}
.section-label{display:inline-block;font-size:0.65rem;letter-spacing:0.4em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem}
.section-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,5vw,3.5rem);font-weight:300;font-style:italic;color:var(--cream);line-height:1.1}
.productions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:rgba(201,168,76,0.08);margin:0 0 6rem}
.production-card{background:var(--ink);position:relative;overflow:hidden;aspect-ratio:3/4;cursor:pointer;display:block;text-decoration:none;color:inherit}
.production-card:hover .card-image{transform:scale(1.06)}
.production-card:hover .card-overlay{opacity:1}
.production-card:hover .card-cta{opacity:1;transform:translateY(0)}
.card-image{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94);filter:sepia(20%) brightness(0.85)}
.card-image-placeholder{width:100%;height:100%;background:var(--card-bg);display:flex;align-items:center;justify-content:center;position:relative}
.card-image-placeholder::after{content:'';position:absolute;inset:20px;border:1px solid rgba(201,168,76,0.12);pointer-events:none}
.placeholder-icon{font-size:3rem;opacity:0.15}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,12,10,0.97) 0%,rgba(14,12,10,0.5) 50%,rgba(14,12,10,0.1) 100%);opacity:0.85;transition:opacity 0.4s ease}
.card-info{position:absolute;bottom:0;left:0;right:0;padding:1.5rem}
.card-year{font-size:0.6rem;letter-spacing:0.35em;color:var(--gold);text-transform:uppercase;margin-bottom:0.4rem}
.card-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:400;color:var(--cream);line-height:1.2;margin-bottom:0.3rem}
.card-role{font-size:0.65rem;letter-spacing:0.2em;color:var(--gold-light);text-transform:uppercase;font-weight:300}
.card-cta{display:inline-flex;align-items:center;gap:0.5rem;margin-top:1rem;font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--gold-dim);padding-bottom:2px;opacity:0;transform:translateY(8px);transition:opacity 0.35s 0.05s ease,transform 0.35s 0.05s ease}
.card-cta svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,8,6,0.96);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.4s ease;padding:2rem}
.modal-backdrop.active{opacity:1;pointer-events:all}
.modal-inner{width:100%;max-width:900px;position:relative;transform:translateY(20px);transition:transform 0.4s ease}
.modal-backdrop.active .modal-inner{transform:translateY(0)}
.modal-close{position:absolute;top:-3rem;right:0;background:none;border:none;color:var(--muted);font-family:'Josefin Sans',sans-serif;font-size:0.65rem;letter-spacing:0.3em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:0.5rem;transition:color 0.3s;padding:0}
.modal-close:hover{color:var(--cream)}
.video-wrapper{position:relative;padding-bottom:56.25%;height:0;background:#000;border:1px solid var(--card-border)}
.video-wrapper iframe{position:absolute;inset:0;width:100%;height:100%}
.modal-meta{padding:1.25rem 0 0;display:flex;align-items:baseline;gap:1rem}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;font-style:italic;color:var(--cream)}
.modal-role{font-size:0.65rem;letter-spacing:0.25em;color:var(--gold);text-transform:uppercase}
.footer{border-top:1px solid rgba(201,168,76,0.12);text-align:center;padding:4rem 2rem}
.footer-name{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-style:italic;color:var(--gold);margin-bottom:0.5rem}
.footer-contact{font-size:0.65rem;letter-spacing:0.3em;color:var(--muted);text-transform:uppercase}
.footer-contact a{color:var(--gold-light);text-decoration:none;transition:color 0.3s}
.footer-contact a:hover{color:var(--cream)}
.footer-copy{margin-top:2rem;font-size:0.55rem;letter-spacing:0.2em;color:rgba(122,116,105,0.5)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:0;transform:translateY(24px);transition:opacity 0.7s ease,transform 0.7s ease}
.reveal.visible{opacity:1;transform:translateY(0)}
@media(max-width:600px){.nav-links{display:none}.productions-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-name">Veronica J. Fowler</a>
  <ul class="nav-links">
    <li><a href="#productions">Productions</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<section class="hero">
  <p class="hero-eyebrow">Musical Theatre Performer</p>
  <h1 class="hero-name">Veronica J. <em>Fowler</em></h1>
  <p class="hero-tagline">Singer &nbsp;&middot;&nbsp; Actress &nbsp;&middot;&nbsp; Dancer</p>
  <div class="hero-divider"></div>
  <button class="hero-scroll" onclick="document.getElementById('productions').scrollIntoView({behavior:'smooth'})">View Productions &darr;</button>
</section>

<section id="productions">
  <div class="section-header reveal">
    <span class="section-label">On Stage</span>
    <h2 class="section-title">Productions &amp; Performances</h2>
  </div>
  <div class="productions-grid" id="grid"></div>
</section>

<footer class="footer" id="contact">
  <p class="footer-name">Veronica J. Fowler</p>
  <p class="footer-contact">
    Contact &nbsp;&middot;&nbsp; <a href="mailto:veronica.jean.fowler@gmail.com">veronica.jean.fowler@gmail.com</a>
  </p>
  <p class="footer-copy">&copy; 2026 Veronica J. Fowler. All rights reserved.</p>
</footer>

<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-label="Performance Video">
  <div class="modal-inner">
    <button class="modal-close" id="modal-close">&#x2715; &nbsp; Close</button>
    <div class="video-wrapper" id="video-wrapper"></div>
    <div class="modal-meta">
      <span class="modal-title" id="modal-title"></span>
      <span class="modal-role" id="modal-role"></span>
    </div>
  </div>
</div>

<script>
// ── EDIT YOUR PRODUCTIONS HERE ──
const productions = [
  { title: "Young Artists Got Talent",  role: "1st Place & Audience Choice Winner",  year: "2026", image: "", video: "" },
  { title: "Shrek",                     role: "Fiona",          year: "2026", image: "", video: "" },
  { title: "Below 54",                  role: "Singer",         year: "2026", image: "", video: "" },
  { title: "Chicago",                   role: "Mama Morton",      year: "2025", image: "Chicago.jpg", video: "" },
  { title: "Mean Girls",                role: "Regina George", year: "2024", image: "", video: "" },
  { title: "Once Upon A Mattress",      role: "Princess Winnifred", year: "2023", image: "", video: "" },
  
];

function embedUrl(url) {
  if (!url) return null;
  try {
    var u = new URL(url);
    if (u.hostname === 'youtu.be') return 'https://www.youtube.com/embed/' + u.pathname.slice(1);
    var v = u.searchParams.get('v');
    if (v) return 'https://www.youtube.com/embed/' + v;
    if (u.pathname.indexOf('/embed/') > -1) return url;
  } catch(e) {}
  return url;
}

var grid = document.getElementById('grid');
productions.forEach(function(p, i) {
  var hasVideo = !!p.video;
  var card = document.createElement(hasVideo ? 'a' : 'div');
  card.className = 'production-card reveal';
  card.style.transitionDelay = (i % 4) * 0.07 + 's';
  if (hasVideo) {
    card.href = '#';
    card.addEventListener('click', function(e) { e.preventDefault(); openModal(p); });
  }
  var img = p.image
    ? '<img class="card-image" src="' + p.image + '" alt="' + p.title + '" loading="lazy">'
    : '<div class="card-image-placeholder"><span class="placeholder-icon">&#10022;</span></div>';
  var cta = hasVideo
    ? '<span class="card-cta">Watch Performance <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>'
    : '';
  card.innerHTML = img + '<div class="card-overlay"></div><div class="card-info"><p class="card-year">' + p.year + '</p><h3 class="card-title">' + p.title + '</h3><p class="card-role">' + p.role + '</p>' + cta + '</div>';
  grid.appendChild(card);
});

var modal = document.getElementById('modal');
var videoWrapper = document.getElementById('video-wrapper');
var modalTitle = document.getElementById('modal-title');
var modalRoleEl = document.getElementById('modal-role');

function openModal(p) {
  var embed = embedUrl(p.video);
  videoWrapper.innerHTML = '<iframe src="' + embed + '?autoplay=1&rel=0" allow="autoplay; fullscreen" frameborder="0" allowfullscreen></iframe>';
  modalTitle.textContent = p.title;
  modalRoleEl.textContent = 'as ' + p.role + ' \u00b7 ' + p.year;
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modal.classList.remove('active');
  videoWrapper.innerHTML = '';
  document.body.style.overflow = '';
}

document.getElementById('modal-close').addEventListener('click', closeModal);
modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

var observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
  });
}, { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach(function(el) { observer.observe(el); });
</script>
</body>
</html>
